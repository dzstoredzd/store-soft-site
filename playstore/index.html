<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Store Soft — Google Play</title>
  <noscript><meta http-equiv="refresh" content="0;url=https://play.google.com/store/apps/details?id=com.yousoft.storesoft&amp;referrer=utm_source%3Ddirect-link" /></noscript>
  <script>
    // Short link to Google Play. ?ref=business-card becomes the UTM tag Play
    // Console counts: &referrer=utm_source%3Dbusiness-card. No ref: direct-link.
    (function () {
      var ref = new URLSearchParams(location.search).get('ref');
      var source = ref && /^[a-z0-9_-]{1,40}$/i.test(ref) ? ref : 'direct-link';
      var url = 'https://play.google.com/store/apps/details?id=com.yousoft.storesoft' +
        '&referrer=' + encodeURIComponent('utm_source=' + source);
      window.playUrl = url;
      location.replace(url);
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7ff; color: #15213d; font: 18px/1.6 "Segoe UI", Tahoma, sans-serif; text-align: center; }
    a { display: inline-block; margin: 16px; padding: 14px 24px; border-radius: 12px; background: #315ce8; color: #fff; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <a id="open" href="https://play.google.com/store/apps/details?id=com.yousoft.storesoft&amp;referrer=utm_source%3Ddirect-link">افتح Store Soft على Google Play</a>
  <script>document.getElementById('open').href = window.playUrl;</script>
</body>
</html>
